<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Simple Notes</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@100..800&display=swap');
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: "Playpen Sans", cursive;
        }

        header{
            width:100vw;
            /* box-shadow: 0 8px 2px -2px rgb(211, 221, 222); */
            padding: 20px;
            background-color:rgb(179, 223, 250);
            color: rgb(3, 124, 205);
            height: 88px;
        }

        .main{
            padding: 20px;
            display: flex;
            flex-direction: row;
            height: calc(100vh - 88px);
            background-color: rgba(232, 246, 255, 0.14);
        }

        .add-container{
            display: inline-block;
            width: 100%;
            margin-bottom: 10px;
        }

        .add-new-notes{
            width: fit-content;
            display: block;
            padding: 10px;
            border: 1px solid gray;
            float:right;
            cursor: pointer;
            font-size: 14px;
        }

        .add-new-notes:hover{
            background-color: rgba(232, 246, 255, 0.57);
        }

        .add-new-notes i{
            padding-right: 10px;
        }

        .all-list{
            width: 30%;
            border-right: 2px solid grey;
            padding: 10px 20px 10px 0px;
        }

        .list-record{
            display:flex;
            flex-direction:row;
            border-bottom: 1px solid rgb(210, 210, 210);
            padding: 10px;
            cursor: pointer;
        }

        .list-record:hover{
            background-color: rgba(232, 246, 255, 0.57);
        }

        .list-detail{
            width: 90%;
        }

        .list-detail h1{
            font-size: 20px;
            width: 100%;
            padding-bottom: 5px;
        }

        .list-detail p{
            font-size: 12px;
            color: grey;
        }

        .list-delete{
            width: 10%;
            place-content:center;
            display: inline-grid;
        }

        .list-delete i{
            color:rgb(201, 64, 64);
            cursor: pointer;
        }

        .list-delete i:hover{
            opacity: 0.8;
        }

        .empty-content-container{
            display: flex;
            flex: 1;
            place-content:center;
        }

        .empty-content-container h1{
            font-weight: normal;
            text-align: center;
            place-content: center;
        }

        .content-container{
            width: 70%;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .content-top{
            display: flex;
            flex-direction: row;
        }

        .content-title{
            width: 95%;
            resize: none;
            border: none;
            outline: none;
            height: 70px;
            font-size: 30px;
            font-weight: bold;
            padding: 10px;
            place-content: space-evenly;
            background-color: transparent;
        }

        .content-top i{
            display: inline-grid;
            font-size: 25px;
            place-self: center;
           cursor: pointer;
        }

        .content-top i:hover{
            opacity: 0.5;
        }

        .content-text{
            width: 100%;
            resize: none;
            border: none;
            outline: none;
            height: auto;
            font-size: 16px;
            padding: 10px;
            line-height: 2;
            background-color: transparent;
            flex: 1;
        }
    </style>
</head>
<body>
    <div>
        <header>
            <h1>Simple Notes</h1>
        </header>

        <div class="main">
            <div class="all-list">
                <div class="add-container">
                    <div class="add-new-notes" v-on:click="addNewNote">
                        <i class="fa-solid fa-plus"></i><span>New Note</span>
                    </div>
                </div>

                <div v-if="notes.length === 0" class="list-record" style="cursor:initial;">
                    <div class="list-detail">
                        <h1>No notes</h1>
                    </div>
                </div>

                <div v-for="(note, index) in notes" :key="index" class="list-record" v-on:click="selectNote(index)">
                    <div class="list-detail">
                        <h1>{{ truncate(note.title, 30) }}</h1>
                        <p>{{ note.date }}</p>
                    </div>
                    <div class="list-delete" v-on:click.stop="deleteNote(index)">
                        <i class="fa-solid fa-trash"></i>
                    </div>
                </div>
            </div>

            <div class="content-container" v-if="selectedNoteIndex !== null">
                <div style="display: flex; flex-direction: column; height: 100%;">
                    <div class="content-top">
                        <textarea class="content-title" v-model="notes[selectedNoteIndex].title"></textarea>
                        <i class="fa-solid fa-check" v-on:click="saveNote"></i>
                    </div>
                    <hr>
                    <textarea class="content-text" v-model="notes[selectedNoteIndex].content"></textarea>
                </div>
            </div>

            <div class="empty-content-container" v-else>
                <h1>Please select a note.</h1>
            </div>
        </div>
    </div>

    <script>
        Vue.createApp({
            data() {
                return {
                    notes: [],
                    selectedNoteIndex: null,
                    originalNote: null, 
                };
            },
            methods: {
                truncate(text, length) {
                    return text.length > length ? text.substring(0, length) + '...' : text;
                },
                selectNote(index) {
                    if (this.selectedNoteIndex !== null) {
                        const currentNote = this.notes[this.selectedNoteIndex];
                        if (currentNote.title !== this.originalNote.title || currentNote.content !== this.originalNote.content) {
                            const confirmSave = confirm('You have unsaved changes. Do you want to save them before switching notes?');
                            if (confirmSave) {
                                this.saveNote();
                            }
                        }
                    }
                    this.selectedNoteIndex = index;
                    this.originalNote = { ...this.notes[index] }; 
                },
                fetchNotes() {
                    axios.get('retrieveNote.php')
                        .then(response => {
                            if (response.data && Array.isArray(response.data)) {
                                this.notes = response.data;
                            } else {
                                alert('Failed to retrieve notes. Please check the server.');
                            }
                        })
                        .catch(error => {
                            alert('Error fetching notes. Please check the server.');
                        });
                },
                deleteNote(index) {
                    const noteToDelete = this.notes[index];
                    axios.post('deleteNote.php', { id: noteToDelete.id })
                        .then(response => {
                            if (response.data.success) {
                                this.notes.splice(index, 1);
                                if (this.selectedNoteIndex === index) this.selectedNoteIndex = null;
                            } else {
                                alert('Failed to delete note. Please check the server.');
                            }
                        })
                        .catch(error => {
                            alert('Error deleting note. Please check the server.');
                        });
                },
                addNewNote() {
                    if (this.selectedNoteIndex !== null) {
                        const currentNote = this.notes[this.selectedNoteIndex];
                        if (currentNote.title !== this.originalNote.title || currentNote.content !== this.originalNote.content) {
                            const confirmSave = confirm('You have unsaved changes. Do you want to save them before creating a new note?');
                            if (confirmSave) {
                                this.saveNote();
                            }
                        }
                    }
                    const newNote = {
                        title: 'New Note',
                        content: '',
                        date: new Date().toISOString().slice(0, 10),
                    };
                    axios.post('addNewNote.php', newNote)
                        .then(response => {
                            if (response.data.success && response.data.note) {
                                this.notes.unshift(response.data.note);
                                this.selectedNoteIndex = 0;
                                this.originalNote = { ...response.data.note }; 
                            } else {
                                alert('Failed to add note. Please check the server.');
                            }
                        })
                        .catch(error => {
                            alert('Error adding note. Please check the server.');
                        });
                },
                saveNote() {
                    const noteToSave = this.notes[this.selectedNoteIndex];
                    axios.post('saveNote.php', noteToSave)
                        .then(response => {
                            if (response.data.success) {
                                alert('Note saved!');
                                this.originalNote = { ...noteToSave };
                            } else {
                                alert('Failed to save note. Please check the server.');
                            }
                        })
                        .catch(error => {
                            alert('Error saving note. Please check the server.');
                        });
                },
            },
            mounted() {
                this.fetchNotes();
            },
        }).mount('body');
    </script>
</body>
</html>
